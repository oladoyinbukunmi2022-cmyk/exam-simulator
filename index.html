<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clinical Chemistry Exam Simulator</title>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--card:#f4f5f7;--ac:#1d4ed8;--ok:#15803d;--bad:#b91c1c;--bd:#cfd3d9}
@media(prefers-color-scheme:dark){:root{--bg:#14161a;--fg:#e8e8e8;--card:#21242a;--ac:#6b9bff;--ok:#4ade80;--bad:#f87171;--bd:#3a3f47}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif}
.w{max-width:820px;margin:0 auto;padding:12px}
.top{position:sticky;top:0;background:var(--bg);padding:8px 0;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--bd);z-index:2}
.t{font-weight:700;font-size:20px}.t.l{color:var(--bad)}
button{font:inherit;padding:8px 14px;border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:8px;cursor:pointer}
button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
.o{display:block;width:100%;text-align:left;margin:6px 0;padding:10px}
.o.s{border-color:var(--ac);background:rgba(29,78,216,.15)}
.o.ok{border-color:var(--ok);background:rgba(21,128,61,.2)}.o.no{border-color:var(--bad);background:rgba(185,28,28,.2)}
.nav{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0}
.nav button{width:38px;padding:6px 0;font-size:13px}
.nav .a{background:var(--ac);color:#fff}.nav .f{outline:2px solid #d97706}.nav .c{box-shadow:0 0 0 2px var(--fg)}
.stem{white-space:pre-line;margin:10px 0}
table{border-collapse:collapse;margin:8px 0;font-size:14px}td{border:1px solid var(--bd);padding:3px 8px}
.img{border:2px dashed var(--bd);padding:14px;text-align:center;border-radius:8px;margin:8px 0;opacity:.8}
.card{background:var(--card);padding:14px;border-radius:10px;margin:12px 0}
</style></head><body><div class="w" id="app"></div>
<script>
const Q=[
[`A laboratory quantifies serum testosterone by LC-MS/MS. Deuterium-labelled testosterone is added to every calibrator, control and patient specimen before extraction. What is the main purpose of this labelled compound?`,["It replaces the calibrators because its known amount defines the whole response curve","It raises ionization of the analyte by supplying extra charge in the ion source","It acts as the control material, so separate QC specimens are no longer needed","It corrects for extraction loss and ion suppression by behaving like the analyte"],3],
[`A competitive chemiluminescent immunoassay for digoxin uses enzyme-labelled digoxin that competes with digoxin in the specimen for a limited number of antibody binding sites. Which statement describes the light signal from a specimen with a very high digoxin concentration?`,["The signal is high because more digoxin is bound to the antibody","The signal is low because less labelled digoxin binds to the antibody","The signal is unchanged until all of the antibody sites are saturated","The signal is high because a labelled sandwich forms around the analyte"],1],
[`A healthy 11-year-old in a growth spurt has an ALP of 320 U/L with normal ALT and GGT. The report carries an adult interval of 40-130 U/L. How should the result be reported?`,["Compare it with a pediatric age-specific interval and report it unflagged","Flag it as high and advise a liver work-up since it exceeds the adult limit","Keep the adult interval and add a comment that bone growth is the likely cause","Hold the result and ask for a fasting recollection from the child today"],0],
[`Over two days, a chemistry analyzer shows rising imprecision on its 340 nm assays (ALT, LD and urea) with repeated low lamp energy warnings, while the 600 nm assays perform normally. Reagents, calibrations and the water system are unchanged. What is the most likely cause?`,["A partly blocked sample probe delivering short sample volumes","Contaminated filling solution in the ISE reference electrode","An aging halogen lamp with falling output in the ultraviolet range","A failing deionized water supply that raises the blank absorbance"],2],
[`At the collection desk, a gold-top tube is handwritten "Okafor, Chidi" with date of birth 1984-03-12 and the collector's initials. The requisition reads "Okafor, Chidi" with date of birth 1948-03-12. The patient has already left, and a routine electrolyte panel was ordered.\nWhat should the technologist do?`,["Run the panel because the names match, then relabel the tube from the requisition","Hold the tube, notify the collection site, and request a recollection","Run the panel and add a comment that the birth date differs from the requisition","Phone the clinic to confirm the birth date, then correct the tube label"],1],
[`A man with heart failure has been started on sacubitril/valsartan, a neprilysin inhibitor. Which marker is the better choice for monitoring his ventricular wall stress, and why?`,["BNP, because neprilysin inhibition lowers it in proportion to wall stress","Troponin I, because it rises with ventricular stretch and falls with treatment","CK-MB, because its release tracks the filling pressure of the ventricle","NT-proBNP, because neprilysin inhibition raises BNP but spares NT-proBNP"],3],
[`A sodium ion-selective electrode is calibrated with two standards at 37 °C. The electrode potential is logarithmic in sodium activity. The values are shown.\nSpecimen | Sodium (mmol/L) | Potential (mV)\nLow calibrator | 100 | 10.0\nHigh calibrator | 180 | 25.3\nPatient | ? | 17.6\nWhat is the patient's sodium concentration?`,["140 mmol/L","125 mmol/L","134 mmol/L","113 mmol/L"],2],
[`A patient arrives 2 hours after reporting a large acetaminophen ingestion. The serum acetaminophen is 180 µmol/L. What is the correct interpretation?`,["It cannot be plotted on the nomogram before 4 hours, so repeat it at 4 hours","It lies below the treatment line, so no antidote is needed and discharge is safe","It can be doubled to estimate the 4 hour level since the half-life is near 2 hours","It needs repeating only if the patient later develops signs of liver injury"],0],
[`A STAT plasma ammonia is collected in a lithium heparin tube at the bedside. The tube is left unspun at room temperature and reaches the laboratory 90 minutes later. What is the expected effect, and what is the correct response?`,["Falsely low from loss as gas; report it with a comment that it is a minimum value","No meaningful change over this time in heparin plasma; report the result as usual","Falsely high from hemolysis alone; spin the tube and test the supernatant plasma","Falsely high from ongoing release and deamination; reject and recollect on ice"],3],
[`Which serum protein electrophoresis pattern is characteristic of cirrhosis?`,["Normal albumin with a flat alpha-1 region and an otherwise normal pattern","Low albumin with raised alpha-2 globulins and reduced gamma globulins","Low albumin with a broad gamma increase that bridges into the beta region","Normal albumin with a narrow spike in the gamma region and a low background"],2],
[`A neurosurgical patient receiving a mannitol infusion has the results below. Osmolality was measured by freezing-point depression.\nTest | Result | Reference\nSodium | 142 mmol/L | 135-145\nGlucose | 5.0 mmol/L | 3.9-6.0\nUrea | 6.0 mmol/L | 3.0-8.0\nMeasured osmolality | 322 mOsm/kg | 275-295\nUsing 2 x sodium + glucose + urea, what are the calculated osmolality and the osmolal gap?`,["Calculated 306 mOsm/kg; osmolal gap 16 mOsm/kg","Calculated 295 mOsm/kg; osmolal gap 27 mOsm/kg","Calculated 289 mOsm/kg; osmolal gap 33 mOsm/kg","Calculated 300 mOsm/kg; osmolal gap 22 mOsm/kg"],1],
[`A 36-year-old woman has fatigue, weight loss, skin hyperpigmentation and dizziness on standing. The results are shown.\nTest (08:00) | Result | Reference\nCortisol | 82 nmol/L | 140-690\nACTH | 58 pmol/L | 2-11\nSodium | 128 mmol/L | 135-145\nPotassium | 5.7 mmol/L | 3.5-5.0\nWhich condition do these results best fit?`,["Primary adrenal insufficiency from adrenal cortex destruction","Secondary adrenal insufficiency from pituitary or hypothalamic failure","Adrenal suppression from long-term exogenous glucocorticoid use","Cushing syndrome from an ACTH-secreting tumour outside the pituitary"],0],
[`Calcium QC level 1 has a target mean of 2.50 mmol/L and an SD of 0.05 mmol/L, run once daily. Level 2 has stayed within its limits throughout. The last 8 level 1 results are shown.\nDay | Result (mmol/L) | SD from mean\n1 | 2.51 | +0.2\n2 | 2.52 | +0.4\n3 | 2.53 | +0.6\n4 | 2.54 | +0.8\n5 | 2.56 | +1.2\n6 | 2.57 | +1.4\n7 | 2.58 | +1.6\n8 | 2.59 | +1.8\nWhich statement correctly describes the QC status on day 8?`,["The 2-2s rule is violated, signalling systematic error that needs immediate recalibration","The 10x rule is violated, signalling a systematic shift that began on the first day","The 4-1s rule is violated, signalling systematic error such as a drifting calibration","No rule is violated because no result exceeds 2 SD, so this is random variation"],2],
[`A 45-year-old without abdominal pain has a persistently raised serum amylase of 380 U/L (reference below 100) with a normal lipase and a very low urinary amylase. Which explanation fits best?`,["Resolving acute pancreatitis, in which lipase normalizes sooner than amylase","Salivary gland disease, in which filtered salivary amylase raises the urine amylase","Chronic pancreatitis, in which damaged acinar cells leak large amounts of enzyme","Macroamylasemia, in which amylase bound to immunoglobulin is too large to filter"],3],
[`A laboratory's critical value policy is shown. Four unrelated results have just been verified.\nTest | Critical low | Critical high\nPotassium (mmol/L) | below 2.8 | above 6.2\nSodium (mmol/L) | below 120 | above 160\nGlucose (mmol/L) | below 2.5 | above 25.0\nTotal calcium (mmol/L) | below 1.50 | above 3.50\nWhich result requires immediate telephone notification of the responsible clinician?`,["Total calcium 1.46 mmol/L, from a ward patient","Potassium 6.1 mmol/L, from an outpatient clinic","Sodium 121 mmol/L, from an emergency patient","Glucose 24.4 mmol/L, from an intensive care unit"],0],
[`A patient found drowsy has a plasma glucose of 2.2 mmol/L. Insulin is 180 pmol/L (raised) and C-peptide is 0.10 nmol/L (suppressed). The sulfonylurea screen is negative. Which cause is most consistent with these results?`,["Insulinoma, in which tumour cells release insulin and C-peptide in equal amounts","Exogenous insulin administration, which raises insulin and lowers C-peptide","Sulfonylurea ingestion, which drives insulin and C-peptide up in step","Adrenal insufficiency, in which insulin and C-peptide are appropriately low"],1],
[`A pre-employment urine drug screen by immunoassay is presumptively positive for opiates. The employer will use the result in a hiring decision. What is required before the result is reported as positive?`,["A repeat of the same immunoassay on a second aliquot, reporting a positive when it agrees","A second immunoassay from a different manufacturer, reported as confirmed if it agrees","A written request from the physician, after which the screen may be reported as positive","Confirmation by mass spectrometry at a designated laboratory with chain of custody"],3],
[`A 68-year-old man has had vomiting and poor oral intake for 3 days. Urea is 26.0 mmol/L (3.0-8.0) and creatinine is 125 µmol/L (60-110). Urine sodium is low and urine specific gravity is high. Which interpretation is most likely?`,["Acute tubular necrosis, in which urea and creatinine rise together with dilute urine","Rhabdomyolysis, in which muscle injury raises creatinine far more than urea","Prerenal azotemia from volume depletion, with urea rising out of proportion","Advanced chronic kidney disease, in which urea and creatinine rise in proportion"],2],
[`A patient taking prednisolone has features of adrenal insufficiency. Her 08:00 serum cortisol by immunoassay is 640 nmol/L, and the antibody is known to cross-react with prednisolone. Which approach gives a valid cortisol result?`,["Measure cortisol by LC-MS/MS, which separates it from prednisolone before detection","Dilute the specimen 1:10 and multiply, because dilution removes the cross-reactivity","Repeat it in a heterophile blocking tube, since the interference is antibody-based","Run the immunoassay in duplicate and report the mean to average out the error"],0],
[`A laboratory must validate a new reagent lot for its TSH assay. Which protocol best supports the decision to release the lot?`,["Assay only the two QC levels on old and new lots and accept when within limits","Assay three normal patient specimens on the new lot and compare them with the reference range","Accept the manufacturer's certificate of analysis and file it with no local comparison","Assay patient specimens across the range on old and new lots and compare with set criteria"],3],
[`The photometer lamp on a chemistry analyzer was replaced during scheduled maintenance this morning. The previous reagent calibrations are still stored in the instrument, and day shift is waiting for results.\nWhat must be done before patient testing resumes?`,["Resume testing at once because stored calibrations stay valid after a lamp change","Run the photometer check, recalibrate as required, and verify with acceptable QC","Run one control level on one assay and release the rest if that single result passes","Run patient samples in duplicate and accept them if the duplicates agree within 5%"],1],
[`An ALT assay on a spectrophotometer follows NADH consumption at 340 nm. The assay parameters and the measured rate are shown.\nParameter | Value\nReagent volume | 1.00 mL\nSample volume | 0.100 mL\nPath length | 1.0 cm\nNADH absorptivity at 340 nm | 6.22 L/(mmol x cm)\nRate of absorbance decrease | 0.050 per minute\nWhat is the ALT activity in the sample?`,["80 U/L","8.0 U/L","88 U/L","880 U/L"],2],
[`A sodium control (mean 140.0 mmol/L, SD 2.0 mmol/L) has been plotted for 20 consecutive daily runs. Today's result is the last point. The second control level is within limits.\n[Note: the Levey-Jennings chart image was not supplied with the questions. The answer key says the last 10 points are all above the mean.]\nWhich rule is violated, and what is the correct action?`,["4-1s; reject the run and look for a random error such as a pipetting fault","1-2s; accept the run and continue to monitor because it is only a warning","No violation; accept the run because no point lies beyond 2 SD of the mean","10x; reject the run and seek a systematic error such as a calibration change"],3],
[`A 19-year-old develops mild jaundice during a fasting viral illness. Total bilirubin is 38 µmol/L with direct bilirubin 4 µmol/L. ALT, ALP and GGT are normal, and hemoglobin, reticulocyte count and haptoglobin are normal. Which diagnosis fits best?`,["Gilbert syndrome, caused by reduced UGT1A1 enzyme activity in conjugation","Dubin-Johnson syndrome, caused by impaired excretion of conjugated bilirubin","Hemolytic anemia, caused by accelerated breakdown of red blood cells","Common bile duct obstruction, caused by a gallstone blocking bile flow"],0],
[`A ward patient's creatinine is 150 µmol/L today compared with 410 µmol/L yesterday, and urea has fallen from 28.5 to 9.8 mmol/L. The patient is not known to be on dialysis, and the delta check fails. What is the best next step?`,["Release the results because the two analytes changed in the same direction","Reject the specimen because a failed delta check can never be released","Confirm identity and check the chart for a cause such as dialysis first","Hold the results until the next scheduled draw to confirm the new trend"],2],
[`A laboratory plans to verify a manufacturer's reference interval for sodium using 20 healthy reference individuals. How many results may fall outside the interval before verification fails?`,["No result at all may lie outside the interval, 0 of 20","No more than 2 of the 20 results outside, which is 10%","No more than 5 of the 20 results outside, which is 25%","No more than 1 of the 20 results outside, which is 5%"],1],
[`A 30-year-old with hereditary hemolytic anemia has an HbA1c of 4.4% but a fasting plasma glucose of 7.8 mmol/L on two separate days. What is the best interpretation?`,["The HbA1c is falsely low from short red cell survival, so glucose criteria apply","The glucose results are falsely high because of hemolysis, so HbA1c is better","The patient has prediabetes, since the HbA1c below 6.0% outweighs the glucose","The discordance is analytical, so the tests should be repeated on a new reagent lot"],0],
[`A 24-year-old has dark urine two weeks after a sore throat. The strip shows blood large, protein 2+, nitrite negative and leukocyte esterase negative. A field from the centrifuged sediment is shown.\n[IMAGE NOT INCLUDED: unstained urine sediment, high power (400x). The key says the field shows a long cylindrical cast packed with red blood cells, with a few free red cells nearby.]\nWhich element is shown, and what does it indicate?`,["Hyaline cast, a nonspecific finding after exercise or dehydration","White blood cell cast, indicating pyelonephritis or interstitial disease","Granular cast, indicating breakdown of tubular cells after tubular injury","Red blood cell cast, indicating bleeding through damaged glomeruli"],3],
[`To save money, a technologist proposes using leftover assay calibrator as the quality control material for the same assay, because its target value is already known. The supervisor refuses.\nWhat is the main reason for the supervisor's refusal?`,["Calibrators carry no stated concentration, so no target value is available for the comparison","Calibrator material always reads outside the control range because of its different matrix","Calibrator used as control cannot reveal a calibration error; independent material is needed","Calibrator vials are single-use, and their stability changes once they are reopened"],2],
[`A laboratory receives proficiency testing samples for its glucose method. Which handling is acceptable?`,["Run them in triplicate on a freshly calibrated analyzer and report the mean value","Test them in the routine run with the usual replicates, by the staff on duty","Assign them to the most experienced technologist after extra instrument maintenance","Send a portion to a neighbouring laboratory and report the result they agree on"],1],
[`A 67-year-old inpatient on post-operative day 2 has reduced urine output charted by nursing. The specimen was drawn from the arm without an IV, shows no hemolysis, and was labelled with two matching identifiers. The delta check flagged the creatinine (limit: change over 50% within 7 days).\nTest | Two days ago | Today | Reference\nCreatinine (µmol/L) | 74 | 158 | 60-110\nUrea (mmol/L) | 5.2 | 15.6 | 2.5-8.0\nPotassium (mmol/L) | 4.2 | 5.1 | 3.5-5.0\nSodium (mmol/L) | 139 | 138 | 135-145\nCalcium (mmol/L) | 2.31 | 2.29 | 2.15-2.55\nAlbumin (g/L) | 40 | 39 | 35-50\nWhat is the most appropriate action?`,["Hold all results and request a recollection, because the creatinine delta check failed the 50% limit","Release the sodium and potassium only, and suppress the creatinine and urea until the delta flag clears","Repeat the creatinine by a different method and release whichever of the two results is the lower one","Release the results after checking identity and specimen quality, since related analytes moved together"],3],
[`A 45-year-old woman with obesity and a parent with type 2 diabetes has the following results. The OGTT used a 75 g glucose load.\nTest | Result | Normal | Diabetes\nFasting glucose (mmol/L) | 6.5 | Below 6.1 | 7.0 or higher\nHbA1c | 5.8% | Below 6.0% | 6.5% or higher\n2-hour OGTT (mmol/L) | 9.2 | Below 7.8 | 11.1 or higher\nWhich classification do these results support?`,["Prediabetes, since fasting glucose and the 2-hour OGTT value both lie in the intermediate range","Diabetes mellitus, because the 2-hour OGTT value is much higher than the fasting glucose value","Normal glucose metabolism, because the HbA1c is below 6.0%, which excludes any glucose disorder","Diabetes mellitus, because two of the three results lie above the upper limit of the normal range"],0],
[`A 7-month-old infant receiving parenteral nutrition with a lipid emulsion has a lithium heparin specimen that is grossly milky (lipemia index 4+). Sodium (indirect ISE), glucose, creatinine and ALT are ordered, and the lipid infusion cannot be stopped.\nWhat is the best approach?`,["Recollect at once, since a fresh specimen drawn from the infant would not be lipemic at all","Clear the lipid by ultracentrifugation or high-speed centrifugation, rerun the tests, and add a comment","Dilute the specimen 1:2 with saline and multiply every result by 2 to remove the interference","Report every result as measured, since analyzers automatically correct for light scatter from lipid"],1],
[`Four specimens arrive in the laboratory at the same time. Which specimen should be processed first?`,["A gold-top tube for the timed 2-hour post-load glucose from an outpatient glucose tolerance test","A fasting lipid panel and ALT from a family physician's office, delivered by the daily courier","A lithium heparin tube for a STAT potassium on an emergency patient who missed two dialysis sessions","A routine pre-operative creatinine from a day-surgery patient who is booked for next week's operation"],2],
[`A blood ethanol specimen collected for police after a motor vehicle collision arrives by courier. The tamper-evident seal on the bag is broken, and the custody form carries the collector's signature but none from the courier. The tube itself is intact and correctly labelled.\nWhat should the technologist do?`,["Hold the specimen untested, record the broken seal and missing signature, and notify the supervisor","Test the specimen as usual and add a comment about the broken seal to the report sent to the police","Apply a new seal, sign the form as the receiver, and then test the specimen like any other sample","Discard the specimen and ask the police for a new collection, without any further documentation of it"],0],
[`A 62-year-old woman has itching, dark urine and pale stools. Results: ALP 512 U/L (40-130), GGT 640 U/L (below 60), ALT 88 U/L (7-35), AST 71 U/L (10-35), total bilirubin 142 µmol/L (below 21), conjugated bilirubin 118 µmol/L (below 5).\nWhich interpretation is most consistent with these results?`,["Hepatocellular pattern, consistent with acute viral hepatitis because ALT and AST are both raised","Pre-hepatic jaundice, consistent with hemolysis because the total bilirubin is markedly raised","Bone disease, because the ALP is raised out of proportion to the ALT and AST and bone releases GGT","Cholestatic pattern, consistent with obstruction of bile flow such as a gallstone or tumour"],3],
[`A technologist reviews the electrodes of a blood gas analyzer. Which statement describes the measurement principle of the pO₂ electrode?`,["Potentiometric: a pH-sensitive glass membrane generates a voltage that is proportional to the pO₂","Amperometric: oxygen is reduced at a platinum cathode and the current is proportional to pO₂","Potentiometric: pH shifts in a bicarbonate buffer behind a gas-permeable membrane track the pO₂","Spectrophotometric: absorbance of oxyhemoglobin at several wavelengths is proportional to the pO₂"],1],
[`A 70-year-old man with gastric outlet obstruction has had persistent vomiting for 4 days. His arterial blood gas shows pH 7.52, pCO₂ 49 mmHg and HCO₃ 39 mmol/L.\nWhich interpretation is correct?`,["Respiratory alkalosis with renal compensation by bicarbonate retention","Respiratory acidosis with renal compensation by bicarbonate retention","Metabolic alkalosis with respiratory compensation by hypoventilation","Metabolic alkalosis with an additional primary respiratory acidosis"],2],
[`The LIS lists these results awaiting verification. The critical limits shown are the laboratory's own.\nLocation | Test | Result | Critical limits\nOncology clinic | Potassium | 6.4 mmol/L | Below 2.8 or above 6.5\nMedical ward | Sodium | 121 mmol/L | Below 120 or above 160\nEmergency | Glucose | 2.6 mmol/L | Below 2.5 or above 25.0\nCoronary care | Total calcium | 1.46 mmol/L | Below 1.50 or above 3.50\nWhich result requires immediate telephone notification of a responsible clinician?`,["Potassium of 6.4 mmol/L on a patient in the oncology clinic","Sodium of 121 mmol/L on a patient in the general medical ward","Glucose of 2.6 mmol/L on a patient in the emergency department","Calcium of 1.46 mmol/L on a patient in the coronary care unit"],3],
[`A hospitalized neighbour of a technologist texts her and asks her to check his potassium result in the LIS, because he cannot reach his nurse. What is the correct response?`,["Look it up and read it to him, because he is the patient and the laboratory produced the result","Decline and refer him to his care team, because looking up his result is a privacy breach","Open the record only to check that the value is not critical, and then tell him nothing about it","Text him the result once he confirms his date of birth, and record the contact in the LIS system"],1],
[`During a 40-minute failure of the analyzer-to-LIS interface, a technologist keys 12 results into the LIS from the instrument printouts. What is required before these results are released?`,["A second person's check of each keyed value against the printout, with the manual entry recorded","A single recheck by the same technologist who keyed them, since the printouts match the instrument","A comment on abnormal results only, because normal results carry little risk of a transcription error","Destruction of the printouts after entry, so that duplicate records do not appear in the audit trail"],0],
[`A technologist fills a wash bottle with 1 mol/L hydrochloric acid from the supplier container for staff on the weekend rotation, and leaves it on the shared bench shelf.\nWhat does WHMIS require for the wash bottle?`,["No label, because the bottle stays inside the laboratory and the technologist knows what it contains","A hazard pictogram only, because the safety data sheet is already on file in the laboratory office","A workplace label showing the product identifier, handling precautions, and a reference to the SDS","A label with the chemical name only, and a note telling staff to ask the supervisor about hazards"],2],
[`A nurse phones the night technologist and asks what insulin dose to give for a glucose of 19.6 mmol/L. What is the correct response?`,["Give the dose from the posted sliding-scale protocol, since the technologist has seen it many times","Say dosing is outside laboratory scope, refer her to the physician, and offer to recheck the result","Advise holding insulin until a repeat is done, based on the technologist's experience with such results","Suggest a dose to start with, and ask the nurse to confirm it with the physician once it is given"],1],
[`A technologist starting the day shift finds the daily maintenance record of the chemistry analyzer unsigned for the past two days. Today's QC is within limits, and the instrument shows no alarms.\nWhat is the correct action?`,["Initial the missed days as completed, since QC is in control and the analyzer shows no alarms at all","Carry on testing and sign only today's entry, since in-range QC shows that the analyzer is working well","Remove the analyzer from service until a service engineer reviews the missing maintenance records","Do the maintenance now, record the missed days as not done with the reason, and inform the supervisor"],3],
[`An ALT assay follows NADH oxidation at 340 nm. Absorbance falls from 0.842 to 0.692 over 3.0 minutes in a 1.0 cm light path. The sample volume is 0.10 mL, the total reaction volume is 2.10 mL, and the molar absorptivity of NADH at 340 nm is 6.22 L/mmol/cm. What is the ALT activity?`,["507 U/L","8 U/L","169 U/L","1,688 U/L"],2],
[`Over the past week the calcium control CV has risen from 1.1% to 3.6%, while the mean stays within 0.02 mmol/L of the target. The control values scatter on both sides of the mean with no trend or shift. The calibration and reagent were unchanged.\nWhich description fits this QC problem?`,["Random error, which a partly blocked sample probe could produce","Systematic error, which a drifting photometer lamp could produce","Systematic error, which a contaminated reagent blank could produce","Random error, which an outdated calibrator lot could produce"],0],
[`A 34-year-old man has had severe watery diarrhea for 5 days. Results: sodium 138 mmol/L, potassium 2.9 mmol/L, chloride 112 mmol/L, bicarbonate 14 mmol/L, pH 7.29, pCO₂ 30 mmHg.\nWhich interpretation is correct?`,["High anion gap metabolic acidosis from lactate accumulation, with appropriate respiratory compensation","Normal anion gap metabolic acidosis from stool bicarbonate loss, with a superimposed respiratory acidosis","Normal anion gap metabolic acidosis from stool bicarbonate loss, with a superimposed respiratory alkalosis","Normal anion gap metabolic acidosis from stool bicarbonate loss, with appropriate lung compensation"],3],
[`A laboratory uses LC-MS/MS to confirm a drug screen. Which describes the role of the liquid chromatography stage?`,["Converts the separated analytes into charged ions that can be sorted by mass-to-charge ratio","Separates the analytes from the matrix and from each other by retention time before ionization","Breaks the selected parent ion into product ions in a collision cell for specific identification","Counts the ions reaching the detector to give a signal that is proportional to concentration"],1],
[`A patient needs STAT sodium, potassium and creatinine results, and the physician cannot wait for a specimen to clot. Which tube gives the fastest valid result?`,["A serum separator tube, because clotting finishes in 5 minutes if the tube is inverted well","A sodium heparin tube, because heparin plasma can be centrifuged immediately without delay","A lithium heparin tube with gel, centrifuged at once, because plasma does not need time to clot","A grey-top fluoride and oxalate tube, because the additives stabilize electrolytes in transit"],2],
[`A lithium heparin tube for a potassium arrives unspun from a satellite clinic 7 hours after collection. The laboratory's limit for separating plasma from cells is 2 hours. The clinic can be reached by phone.\nHow should the rejection be handled in the LIS?`,["Cancel with a coded rejection reason, record who was told and when, and ask for a recollection","Delete the order from the LIS so that no test is left pending against the patient's record","Leave the order pending and note the rejection only in a paper log that is kept at the bench","Discard the tube immediately and enter nothing in the LIS, because no result was produced"],0],
[`A 24-year-old man has facial swelling and passes dark urine. The urine is smoky red-brown and slightly cloudy. Reagent strip: SG 1.022, pH 5.5, blood large, protein 2+, glucose negative, nitrite negative, leukocyte esterase negative. A representative field of the unstained sediment is shown.\n[IMAGE NOT INCLUDED: unstained urine sediment, high power (400x). The key says the field shows a long cylindrical cast filled with red blood cells, with about a dozen free red cells around it, and no white cells, bacteria or crystals.]\nWhich interpretation fits the gross, strip and microscopic findings together?`,["Myoglobinuria from rhabdomyolysis, with a positive blood strip and no red cells","Bleeding from the glomeruli, as in acute glomerulonephritis, with red cell casts","Acute pyelonephritis, with white cell casts and bacteria in the urine sediment","Lower urinary tract infection, with hematuria and a positive nitrite on the strip"],1],
[`A technologist is stuck in the finger by a used lancet that was left in a specimen bag at the bench. The patient's infection status is unknown.\nWhat is the correct immediate action?`,["Squeeze the wound hard and scrub it with a bleach solution, then carry on with the shift","Apply alcohol-based hand rub, cover the finger, and report the injury at the end of the shift","Cover the finger with a plaster and report only if the patient is later found to be infectious","Wash the wound with soap and running water, then report to occupational health right away"],3],
[`A technologist discovers that a coworker has been recording QC as acceptable for a week without running the controls. What should she do?`,["Report it in writing to the quality manager or supervisor at once, listing the dates and records","Confront the coworker and agree to say nothing as long as the controls are run properly from now on","Run the missing controls herself and record them under the coworker's initials to complete the log","Wait a few more days to see whether patient results show a problem before reporting it to anyone"],0],
[`A 58-year-old man is investigated for fatigue. Total protein is 74 g/L and albumin is 24 g/L. The serum protein electrophoresis densitometer tracing is shown, with albumin on the left and gamma on the right.\n[IMAGE NOT INCLUDED: densitometer tracing. The key says it shows a short albumin peak, small alpha-1 and alpha-2 humps, and the beta and gamma zones merging into one broad raised plateau with no valley between them and no narrow spike.]\nWhich condition is most consistent with this pattern?`,["Multiple myeloma, with a tall narrow monoclonal spike in the gamma zone","Nephrotic syndrome, with a very high alpha-2 band and low gamma","Cirrhosis, with a polyclonal gamma increase and beta-gamma bridging","Acute inflammation, with raised alpha-1 and alpha-2 and a normal gamma"],2],
[`A technologist receives four specimens with requisitions. Which specimen should be rejected?`,["A legible handwritten label with the full name, date of birth, collector initials, and time","A printed label with a readable barcode, placed lengthwise on the tube, that matches the requisition","A requisition with the same patient identifiers as the tube but missing the clinic's fax number","A tube labelled with the right name but a date of birth that has the day and month transposed"],3],
[`The laboratory reviews the quarterly record of a ward point-of-care glucose meter.\nQuality check | Finding\nDaily QC, two levels | Done 29 of 30 days; all in range\nOperator competency | 2 of 14 overdue by 3 weeks\nMeter cleaning | Weekly log complete\nStrip lot opened on 3 October | No lot comparison or QC recorded\nStrip expiry dates | All in date\nStrip storage temperature | Log blank on 2 days; others in range\nWhich finding is the greatest threat to the accuracy of patient results?`,["Daily QC missed on one of 30 days, with all other results in range","A new strip lot put into use without a lot comparison or QC record","Annual competency overdue by three weeks for two of 14 operators","Strip storage temperature log blank on two days, others in range"],1],
[`A vancomycin trough is ordered on a ward patient. Which requisition information is essential for the laboratory to confirm the specimen is valid and interpretable?`,["The patient's fasting status and the time of the last meal eaten","The patient's weight and the infusion pump rate used for dosing","The time of the last dose and the time the specimen was collected","The ordering unit's pager number and the physician's billing number"],2],
[`A 4 L bottle of 6 mol/L hydrochloric acid slips and about 500 mL spills across the floor near the sink. Fumes are noticeable, and a spill kit is available.\nWhat is the correct first action?`,["Alert others, restrict access, and read the safety data sheet while putting on suitable PPE","Pour a bleach solution over the spill to disinfect it, and then wipe it up with paper towels","Neutralize the acid with sodium hydroxide pellets, and then mop it up with paper towels","Wipe it up at once with paper towels in bare gloves, and report it at the end of the shift"],0],
[`An unconscious trauma patient arrives in the emergency department with no identification. The registration desk has assigned a temporary name and number, and a matching wristband has been applied. Blood is needed at once. How should the tubes be labelled?`,["With the name on a wallet card that the ambulance crew found in the patient's pocket","With the temporary name and number from his wristband, checked against the requisition","With the date, time and bed number, because he has no permanent identity to use yet","After he wakes and confirms his name verbally, so the tubes can be labelled correctly"],1],
[`A 68-year-old man with known chronic kidney disease is admitted with vomiting and poor oral intake. His previous creatinine values and today's results are shown.\nDate | Creatinine (µmol/L) | eGFR (mL/min/1.73 m2) | Urea (mmol/L)\n3 months ago | 134 | 50 | 7.9\n6 weeks ago | 131 | 51 | 7.6\n2 days ago | 129 | 53 | 8.1\nToday | 246 | 24 | 21.4\nWhich interpretation is correct?`,["Stable chronic kidney disease with no acute change in kidney function today","Acute kidney injury in a patient who had previously normal kidney function","Chronic kidney disease progressing to dialysis-level failure over 3 months","Acute kidney injury on top of a stable background of chronic kidney disease"],3]
];
const N=Q.length,L="ABCD",DUR=3600;
let cur=0,A=Array(N).fill(-1),F=Array(N).fill(false),end=0,tm=null,done=false;
const $=document.getElementById("app");
function fmt(s){s=Math.max(0,s);return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function stem(s){let out="",tb=[];const fl=()=>{if(tb.length){out+="<table>"+tb.map(r=>"<tr>"+r.split(" | ").map(c=>"<td>"+c+"</td>").join("")+"</tr>").join("")+"</table>";tb=[]}};
for(const l of s.split("\n")){if(l.includes(" | "))tb.push(l);else{fl();out+=l.startsWith("[IMAGE NOT")||l.startsWith("[Note")?'<div class="img">'+l+"</div>":"<div class='stem'>"+l+"</div>"}}fl();return out}
function start(){end=Date.now()+DUR*1000;tm=setInterval(tick,500);cur=0;render()}
function tick(){const r=Math.round((end-Date.now())/1000),e=document.getElementById("tm");if(e){e.textContent=fmt(r);e.className="t"+(r<300?" l":"")}if(r<=0)submit(true)}
function home(){$.innerHTML=`<h1>Clinical Chemistry Exam Simulator</h1><div class="card">${N} questions · 60 minutes · single best answer.<br>No feedback until you submit. You can flag questions and jump between them with the number grid.</div><button class="p" onclick="start()">Start exam</button>`}
function render(){const q=Q[cur];let nav="";for(let i=0;i<N;i++)nav+=`<button class="${A[i]>=0?"a":""} ${F[i]?"f":""} ${i==cur?"c":""}" onclick="cur=${i};render()">${i+1}</button>`;
$.innerHTML=`<div class="top"><span>Question ${cur+1} of ${N} · Answered ${A.filter(x=>x>=0).length}</span><span class="t" id="tm">${fmt(Math.round((end-Date.now())/1000))}</span></div><div class="nav">${nav}</div>${stem(q[0])}`+q[1].map((o,i)=>`<button class="o ${A[cur]==i?"s":""}" onclick="A[cur]=${i};render()"><b>${L[i]}.</b> ${o}</button>`).join("")+`<p><button onclick="cur=Math.max(0,cur-1);render()">← Prev</button> <button onclick="F[cur]=!F[cur];render()">${F[cur]?"Unflag":"Flag for review"}</button> <button onclick="cur=Math.min(N-1,cur+1);render()">Next →</button> <button class="p" onclick="if(confirm('Submit the exam now? You have '+A.filter(x=>x<0).length+' unanswered.'))submit()">Submit</button></p>`}
function submit(auto){clearInterval(tm);done=true;const sc=A.filter((a,i)=>a==Q[i][2]).length,p=Math.round(sc/N*100);
$.innerHTML=`<h1>Results</h1><div class="card"><div class="t">${sc} / ${N} (${p}%)</div>${auto===true?"Time expired. ":""}Unanswered: ${A.filter(x=>x<0).length}</div><button class="p" onclick="location.reload()">Restart</button><h2>Review</h2>`+Q.map((q,i)=>`<div class="card"><b>Q${i+1}.</b>${stem(q[0])}`+q[1].map((o,j)=>`<div class="o ${j==q[2]?"ok":A[i]==j?"no":""}"><b>${L[j]}.</b> ${o}${j==q[2]?" ✔ correct":""}${A[i]==j&&j!=q[2]?" ✘ your answer":""}</div>`).join("")+(A[i]<0?"<i>Not answered</i>":"")+"</div>").join("")}
home();
</script></body></html>
